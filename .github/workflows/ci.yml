name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install FFmpeg Essentials (for audio integration tests)
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "ffmpeg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bin = (Get-ChildItem $dest -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).DirectoryName
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & "$bin\ffmpeg.exe" -version

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npm test

      - name: Run Rust backend tests
        working-directory: src-tauri
        run: cargo test --no-fail-fast

      - name: Check Portable Launcher compilation
        working-directory: src-tauri
        run: cargo check --manifest-path portable-launcher/Cargo.toml
