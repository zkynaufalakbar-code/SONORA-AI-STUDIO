name: Build & Release Windows Distributions

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Package Installer & Portable Editions
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Provision FFmpeg & verify Inno Setup 6
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "ffmpeg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bin = (Get-ChildItem $dest -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).DirectoryName
          Add-Content -Path $env:GITHUB_PATH -Value $bin

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }

      - name: Install npm dependencies
        run: npm ci

      - name: Build Dual Distribution Packages
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-dist.ps1 -Target all

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          $files = @(
            "release/SONORA-AI-Studio-Setup.exe",
            "release/SONORA-AI-Studio-Portable.zip"
          ) | Where-Object { Test-Path $_ }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          Set-Content -Path "release/CHECKSUMS.txt" -Value $lines -Encoding UTF8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/SONORA-AI-Studio-Setup.exe
            release/SONORA-AI-Studio-Portable.zip
            release/CHECKSUMS.txt
